# 字在 Zizai — fork-specific build settings (docs/ARCHITECTURE.md §7.2, docs/IMPLEMENTATION_PLAN.md P0-04).
#
# Kept apart from upstream's gradle.properties, whose version bumps would otherwise conflict on every
# upstream sync. app/build.gradle.kts reads this file and exposes the flags as BuildConfig.ZIZAI_* fields.

# Our own version, independent of upstream's projectVersionCode/projectVersionName.
versionCode=1
versionName=0.1.0

# Where on-device models and dictionaries download from (P0-07). Release tags and file names match
# upstream's, so switching hosts changes nothing else. Mirrored by the "Mirror upstream release
# assets" workflow (all 264 files verified 2026-10-28). Upstream's, for reference:
#   https://github.com/DevEmperor/DictateKeyboard/releases/download
releasesBase=https://github.com/zizaiAndroid/zizai/releases/download

# v1 feature flags (ADR-8). All off for the first Play release; each feature can come back later
# once its Play declaration is done.
#   cloud           Dictate Cloud prepaid credit (upstream's backend and Play Billing)
#   floatingButton  floating dictation button (needs an AccessibilityService)
#   translate       on-device translation (Bergamot; needs a Linux-built native library)
#   gif             GIF search (KLIPY)
cloud=false
floatingButton=false
translate=false
gif=false

# Zizai AI and Zizai Pro (ARCHITECTURE.md ADR-9, section 6.12). Off in release builds until zizai-server is
# live; on in debug builds, against a local `wrangler dev` (reach it with `adb reverse tcp:8787 tcp:8787`).
#   integrityProject  Google Cloud project number for Play Integrity; 0 while the app is only on Play
zizaiAi=false
aiServer=https://api.zizai.io/v1/
zizaiAiDebug=true
aiServerDebug=http://127.0.0.1:8787/v1/
integrityProject=0
