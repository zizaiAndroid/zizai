# 字在 Zizai: build and unit tests on every push and pull request (docs/IMPLEMENTATION_PLAN.md P0-09).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # 21, not 17: upstream's tests expect emoji grapheme clusters, which java.text.BreakIterator
      # only understands since Java 20 (SelectionMetricsTest fails on 17).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The SDK on GitHub's runners has platforms and build-tools; the pinned NDK has to be added.
      - name: Install the pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      # The download from GitHub releases and Maven Central fails now and then; cache it per pinned version.
      - uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
          key: sherpa-onnx-${{ hashFiles('tools/fetch-sherpa-onnx.sh') }}

      - name: Fetch sherpa-onnx native libraries
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Check the branding overlay is up to date
        run: |
          python3 tools/zizai/branding.py
          git diff --exit-code -- app/src/zizai/res || {
            echo "::error::Branding overlay is stale. Run 'python tools/zizai/branding.py' and commit the result."
            exit 1
          }

      - name: Build and unit-test
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache --continue :app:assembleDebug test 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Logs need a login to read, but annotations are public through GitHub's API, so the failure
      # details are surfaced as annotations: Gradle's "What went wrong" blocks, compiler errors, and
      # each failing test with its first message line.
      - name: Report failures as annotations
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          grep -A4 'What went wrong' "$log" | grep -v '^--$' | head -15 \
            | while read -r line; do [ -n "$line" ] && echo "::error title=Gradle::$line"; done
          grep -E '^e: ' "$log" | head -10 | while read -r line; do echo "::error title=Kotlin::$line"; done
          find . -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 \
            | xargs -0 grep -l '<failure' 2>/dev/null | head -10 | while read -r xml; do
              python3 - "$xml" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for f in case.findall("failure"):
                  msg = (f.get("message") or f.text or "").strip().splitlines()[0][:300] if (f.get("message") or f.text) else ""
                  print(f"::error title=Test {case.get('classname')}::{case.get('name')} — {msg}")
          EOF
            done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
