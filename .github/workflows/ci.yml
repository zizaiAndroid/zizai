# 字在 Zizai: build and unit tests on every push and pull request (docs/IMPLEMENTATION_PLAN.md P0-09).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The SDK on GitHub's runners has platforms and build-tools; the pinned NDK has to be added.
      - name: Install the pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      - name: Fetch sherpa-onnx native libraries
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Check the branding overlay is up to date
        run: |
          python3 tools/zizai/branding.py
          git diff --exit-code -- app/src/zizai/res || {
            echo "::error::Branding overlay is stale. Run 'python tools/zizai/branding.py' and commit the result."
            exit 1
          }

      - name: Build and unit-test
        run: ./gradlew --no-configuration-cache :app:assembleDebug test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
