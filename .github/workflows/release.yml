# 字在 Zizai: signed release bundle on a version tag (docs/IMPLEMENTATION_PLAN.md P0-09).
#
# Push a tag like `zizai-v0.1.0` to run it. It needs these repository secrets (Settings → Secrets and
# variables → Actions); without them it stops at the signing step:
#   UPLOAD_KEYSTORE_BASE64   the upload keystore (.jks), base64-encoded
#   UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON  optional: a Play Console service account; when set, the bundle is uploaded
#                              to the internal testing track
name: Release

on:
  push:
    tags: ["zizai-v*"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      - name: Fetch sherpa-onnx native libraries
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Write signing config (never committed)
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build the release bundle
        run: ./gradlew --no-configuration-cache :app:bundleRelease

      # Play blocks updates without 16 KB page-size support (docs/ARCHITECTURE.md §3.4).
      - name: Check 16 KB alignment of native libraries
        run: |
          set -euo pipefail
          aab=$(ls app/build/outputs/bundle/release/*.aab)
          work=$(mktemp -d)
          unzip -q "$aab" 'base/lib/arm64-v8a/*' 'base/lib/x86_64/*' -d "$work"
          objdump=$(ls "$ANDROID_HOME"/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump)
          bad=0
          for so in "$work"/base/lib/*/*.so; do
            min=$("$objdump" -p "$so" | grep -E '^ *LOAD' | grep -oE 'align 2\*\*[0-9]+' | grep -oE '[0-9]+$' | sort -n | head -1)
            if [ "$min" -lt 14 ]; then echo "::error::$(basename "$so") LOAD alignment 2**$min < 2**14"; bad=1; fi
          done
          exit $bad

      - uses: actions/upload-artifact@v4
        with:
          name: zizai-release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload to the internal testing track
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.zizai.keyboard
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
